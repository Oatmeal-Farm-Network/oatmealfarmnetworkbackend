name: Deploy Oatsense Testing

on:
  push:
    branches: [GCP/backend-testing]
    paths:
      - 'oatsense/**'
      - 'app/routers/precision_ag.py'
      - 'app/routers/precision_ag_features.py'
      - 'app/routers/field_maturity.py'
      - 'app/routers/field_assessment_report.py'
      - 'app/routers/field_activity.py'
      - 'app/routers/field_health.py'
      - 'app/routers/field_health_alerts.py'
      - 'app/routers/crop_monitor_proxy.py'
      - 'app/models/precision_ag.py'
      - 'app/database.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-oatsense-testing.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.TESTING_GCP_PROJECT_ID }}
  REGION: ${{ vars.TESTING_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.TESTING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: oatmeal-oatsense-testing
  IMAGE_NAME: oatsense
  CLOUD_SQL_INSTANCE: ${{ vars.TESTING_CLOUD_SQL_INSTANCE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.TESTING_BACKEND_RUNTIME_SA }}
  TESTING_FRONTEND_URL: ${{ vars.TESTING_OATSENSE_FRONTEND_URL || vars.TESTING_FRONTEND_URL }}
  CROP_MONITOR_URL: ${{ vars.TESTING_CROP_MONITOR_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require testing secrets and isolated DB
        shell: bash
        run: |
          missing=0
          require() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub Actions secret/variable: $name"
              missing=1
            fi
          }
          require TESTING_GCP_PROJECT_ID "${{ secrets.TESTING_GCP_PROJECT_ID }}"
          require TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER "${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          require TESTING_GCP_SERVICE_ACCOUNT "${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}"
          require TESTING_BACKEND_RUNTIME_SA "${{ vars.TESTING_BACKEND_RUNTIME_SA }}"
          require TESTING_CLOUD_SQL_INSTANCE "${{ vars.TESTING_CLOUD_SQL_INSTANCE }}"
          require TESTING_OATSENSE_FRONTEND_URL_OR_FRONTEND "${{ vars.TESTING_OATSENSE_FRONTEND_URL || vars.TESTING_FRONTEND_URL }}"
          if [ "$missing" -ne 0 ]; then
            echo "Oatsense testing deploy blocked until TESTING_* and isolated DB exist."
            exit 1
          fi

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build -f oatsense/Dockerfile.backend \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (testing)
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --update-secrets "DB_SERVER=DB_SERVER:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,SECRET_KEY=SECRET_KEY:latest" \
            --update-env-vars "INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE},FRONTEND_URL=${TESTING_FRONTEND_URL},OATSENSE_FRONTEND_URL=${TESTING_FRONTEND_URL},CROP_MONITOR_URL=${CROP_MONITOR_URL},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},SKIP_SCHEMA_ENSURE=true" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
