name: Deploy Livestock Production

# Auto-deploys to production on main when livestock paths change.
# Manual promote via GCP/livestock-prod, livestock-v* tags, or workflow_dispatch still works.
on:
  push:
    branches: [main, GCP/livestock-prod]
    tags: ['livestock-v*']
    paths:
      - 'livestock/**'
      - 'app/routers/livestock.py'
      - 'app/routers/marketplace.py'
      - 'app/routers/ranches.py'
      - 'app/routers/animals.py'
      - 'app/routers/herd_health.py'
      - 'app/routers/auth.py'
      - 'app/models/livestock.py'
      - 'app/database.py'
      - 'app/routers/translation.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-livestock-prod.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.PROD_GCP_PROJECT_ID }}
  REGION: ${{ vars.PROD_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.PROD_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: oatmeal-livestock-prod
  IMAGE_NAME: livestock
  CLOUD_SQL_INSTANCE: ${{ vars.PROD_CLOUD_SQL_INSTANCE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.PROD_LIVESTOCK_RUNTIME_SA }}
  PROD_LOA_FRONTEND_URL: ${{ vars.PROD_LOA_FRONTEND_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require production vars
        shell: bash
        run: |
          missing=0
          for v in PROD_CLOUD_SQL_INSTANCE PROD_LIVESTOCK_RUNTIME_SA PROD_LOA_FRONTEND_URL; do
            # Resolved via env above; empty means GitHub var/secret not set.
            true
          done
          if [ -z "${{ vars.PROD_CLOUD_SQL_INSTANCE }}" ]; then
            echo "::error::Missing GitHub Actions variable: PROD_CLOUD_SQL_INSTANCE"
            missing=1
          fi
          if [ -z "${{ vars.PROD_LIVESTOCK_RUNTIME_SA }}" ]; then
            echo "::error::Missing GitHub Actions variable: PROD_LIVESTOCK_RUNTIME_SA"
            missing=1
          fi
          if [ -z "${{ vars.PROD_LOA_FRONTEND_URL }}" ]; then
            echo "::error::Missing GitHub Actions variable: PROD_LOA_FRONTEND_URL"
            missing=1
          fi
          if [ -z "${{ secrets.PROD_GCP_PROJECT_ID }}" ]; then
            echo "::error::Missing GitHub Actions secret: PROD_GCP_PROJECT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build FRONTEND_URL (LOA required)
        shell: bash
        run: |
          loa="${{ env.PROD_LOA_FRONTEND_URL }}"
          loa="${loa%/}"
          echo "FRONTEND_URL_VALUE=${loa}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.PROD_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.PROD_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build -f livestock/Dockerfile.backend \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (production)
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --update-secrets "DB_SERVER=DB_SERVER:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,SECRET_KEY=SECRET_KEY:latest" \
            --update-env-vars "INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE},FRONTEND_URL=${FRONTEND_URL_VALUE},LOA_FRONTEND_URL=${PROD_LOA_FRONTEND_URL},GCS_LIVESTOCK_IMAGES_BUCKET=oatmeal-farm-network-images,GCS_IMAGES_BUCKET=oatmeal-farm-network-images,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
