name: Deploy Livestock Testing

on:
  push:
    branches: [GCP/backend-testing]
    paths:
      - 'livestock/**'
      - 'app/routers/livestock.py'
      - 'app/routers/marketplace.py'
      - 'app/routers/ranches.py'
      - 'app/routers/animals.py'
      - 'app/routers/herd_health.py'
      - 'app/routers/auth.py'
      - 'app/models/livestock.py'
      - 'app/database.py'
      - 'app/routers/translation.py'
      - 'requirements.txt'
      - '.github/workflows/deploy-livestock-testing.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.TESTING_GCP_PROJECT_ID }}
  REGION: ${{ vars.TESTING_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.TESTING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: oatmeal-livestock-testing
  IMAGE_NAME: livestock
  CLOUD_SQL_INSTANCE: ${{ vars.TESTING_CLOUD_SQL_INSTANCE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.TESTING_BACKEND_RUNTIME_SA }}
  TESTING_LOA_FRONTEND_URL: ${{ vars.TESTING_LOA_FRONTEND_URL }}
  TESTING_FRONTEND_URL: ${{ vars.TESTING_FRONTEND_URL || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require testing secrets and isolated DB
        shell: bash
        run: |
          missing=0
          require() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub Actions secret/variable: $name"
              missing=1
            fi
          }
          require TESTING_GCP_PROJECT_ID "${{ secrets.TESTING_GCP_PROJECT_ID }}"
          require TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER "${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          require TESTING_GCP_SERVICE_ACCOUNT "${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}"
          require TESTING_BACKEND_RUNTIME_SA "${{ vars.TESTING_BACKEND_RUNTIME_SA }}"
          require TESTING_CLOUD_SQL_INSTANCE "${{ vars.TESTING_CLOUD_SQL_INSTANCE }}"
          require TESTING_LOA_FRONTEND_URL "${{ vars.TESTING_LOA_FRONTEND_URL }}"
          if [ "$missing" -ne 0 ]; then
            echo "Livestock testing deploy blocked until TESTING_* and isolated DB exist."
            exit 1
          fi

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build FRONTEND_URL (LOA required, OFN optional)
        shell: bash
        run: |
          loa="${{ env.TESTING_LOA_FRONTEND_URL }}"
          ofn="${{ env.TESTING_FRONTEND_URL }}"
          loa="${loa%/}"
          ofn="${ofn%/}"
          if [ -n "$ofn" ] && [ "$ofn" != "$loa" ]; then
            echo "FRONTEND_URL_VALUE=${loa},${ofn}" >> "$GITHUB_ENV"
          else
            echo "FRONTEND_URL_VALUE=${loa}" >> "$GITHUB_ENV"
          fi
          echo "CORS FRONTEND_URL will be: $(grep FRONTEND_URL_VALUE "$GITHUB_ENV" | cut -d= -f2-)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build -f livestock/Dockerfile.backend \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (testing)
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --update-secrets "DB_SERVER=DB_SERVER:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,SECRET_KEY=SECRET_KEY:latest" \
            --update-env-vars "INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE},FRONTEND_URL=${FRONTEND_URL_VALUE},LOA_FRONTEND_URL=${TESTING_LOA_FRONTEND_URL},GCS_LIVESTOCK_IMAGES_BUCKET=oatmeal-farm-network-images,GCS_IMAGES_BUCKET=oatmeal-farm-network-images,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
