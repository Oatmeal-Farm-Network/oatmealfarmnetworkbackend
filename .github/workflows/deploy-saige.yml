name: Deploy Saige Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "saige/**"
      - ".github/workflows/deploy-saige.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: docker-repo
  REGION: us-central1
  SERVICE_NAME: saige-backend
  MAIN_SERVICE_NAME: oatmealfarmnewtorkbackend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve SECRET_KEY (must match main backend)
        id: secret_key
        run: |
          SECRET_KEY="${{ secrets.SECRET_KEY }}"
          if [ -z "$SECRET_KEY" ]; then
            echo "GitHub SECRET_KEY secret empty ΓÇö fetching from main backend..."
            SECRET_KEY=$(gcloud run services describe "$MAIN_SERVICE_NAME" \
              --region "$REGION" --project "$PROJECT_ID" \
              --format="value(spec.template.spec.containers[0].env.filter(name=SECRET_KEY).extract(value).flatten())")
          fi
          if [ -z "$SECRET_KEY" ]; then
            echo "ERROR: SECRET_KEY is not configured on saige or main backend."
            exit 1
          fi
          echo "SECRET_KEY resolved (length ${#SECRET_KEY})"
          echo "value=$SECRET_KEY" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -f saige/Dockerfile.backend \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME:latest \
            ./saige

      - name: Push Docker image
        run: |
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME:latest

      - name: Deploy to Cloud Run
        env:
          SECRET_KEY: ${{ steps.secret_key.outputs.value }}
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=$REGION,ALLOW_ALL_ORIGINS=true,GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},FRONTEND_URL=https://oatmealfarmnetwork-802455386518.us-central1.run.app,SECRET_KEY=$SECRET_KEY,REDIS_ENABLED=false"

      - name: Show deployed URL
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION --format 'value(status.url)')
          echo "Saige backend deployed at: $URL"
