name: Smoke Backend

on:
  pull_request:
    branches: [ main, epic/backend-reorg ]
  push:
    branches: [ main, epic/backend-reorg ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Smoke test - import app.main
        run: python -c "import app.main"

      - name: Run pytest
        run: pytest
