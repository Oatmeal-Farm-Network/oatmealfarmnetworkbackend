name: Deploy Saige Testing

on:
  push:
    branches: [GCP/backend-testing]
    paths:
      - 'saige/**'
      - '.github/workflows/deploy-saige-testing.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.TESTING_GCP_PROJECT_ID }}
  REGION: ${{ vars.TESTING_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.TESTING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: oatmeal-saige-testing
  IMAGE_NAME: saige
  CLOUD_SQL_INSTANCE: ${{ vars.TESTING_CLOUD_SQL_INSTANCE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require testing secrets and isolated DB
        shell: bash
        run: |
          missing=0
          require() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub Actions secret/variable: $name"
              missing=1
            fi
          }
          require TESTING_GCP_PROJECT_ID "${{ secrets.TESTING_GCP_PROJECT_ID }}"
          require TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER "${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          require TESTING_GCP_SERVICE_ACCOUNT "${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}"
          require TESTING_CLOUD_SQL_INSTANCE "${{ vars.TESTING_CLOUD_SQL_INSTANCE }}"
          require TESTING_FRONTEND_URL "${{ vars.TESTING_FRONTEND_URL }}"
          require TESTING_BACKEND_URL "${{ vars.TESTING_BACKEND_URL }}"
          if [ "$missing" -ne 0 ]; then
            echo "Saige testing deploy blocked until TESTING_* and isolated DB exist."
            exit 1
          fi

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build -f saige/Dockerfile.backend \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            ./saige

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (testing)
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 10 \
            --service-account "saige-sa@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${REGION},GOOGLE_GENAI_USE_VERTEXAI=true,VERTEX_AI_MODEL=gemini-2.5-flash-lite,GEMINI_MODEL=gemini-2.5-flash-lite,SAIGE_LLM_PROVIDER=gemini,FIRESTORE_DATABASE=${{ vars.TESTING_FIRESTORE_DATABASE || 'testing' }},CHAT_HISTORY_DATABASE=${{ vars.TESTING_CHAT_HISTORY_DATABASE || 'chat-history-testing' }},REDIS_ENABLED=false,REDIS_ALLOW_MEMORY_FALLBACK=true,RAG_HYBRID_ENABLED=true,RAG_RERANK_ENABLED=true,RAG_CACHE_ENABLED=true,ALLOW_ALL_ORIGINS=true,FRONTEND_URL=${{ vars.TESTING_FRONTEND_URL }},OFN_BACKEND_URL=${{ vars.TESTING_BACKEND_URL }},INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE}" \
            --set-secrets "SECRET_KEY=SECRET_KEY:latest,CRON_SECRET=CRON_SECRET:latest,DB_SERVER=DB_SERVER:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest"

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
