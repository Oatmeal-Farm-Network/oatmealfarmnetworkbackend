name: Deploy OTF Staging

# Saige-style: isolated package, build context ./otf, dedicated Cloud Run SA.
on:
  push:
    branches: [GCP/otf-staging]
    paths:
      - 'otf/**'
      - '.github/workflows/deploy-otf-staging.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.STAGING_GCP_PROJECT_ID }}
  REGION: ${{ vars.STAGING_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.STAGING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: oatmeal-otf-staging
  IMAGE_NAME: otf
  CLOUD_SQL_INSTANCE: oatmeal-farm-staging:us-central1:oatmeal-staging-sqlserver
  STAGING_FRONTEND_URL: ${{ vars.STAGING_OTF_FRONTEND_URL || vars.STAGING_FRONTEND_URL || 'https://oatmeal-frontend-staging-1087130530284.us-central1.run.app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.STAGING_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build -f otf/Dockerfile.backend \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            ./otf

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --service-account "otf-sa@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "${CLOUD_SQL_INSTANCE}" \
            --set-secrets "DB_SERVER=DB_SERVER:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,DB_NAME=DB_NAME:latest,SECRET_KEY=SECRET_KEY:latest" \
            --set-env-vars "INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE},FRONTEND_URL=${STAGING_FRONTEND_URL},OTF_FRONTEND_URL=${STAGING_FRONTEND_URL},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},SKIP_SCHEMA_ENSURE=true,ALLOW_ALL_ORIGINS=false" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
