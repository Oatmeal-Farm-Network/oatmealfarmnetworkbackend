steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.backend'
      - '-t'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/oatmeal-farm-registry/otf:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/${PROJECT_ID}/oatmeal-farm-registry/otf:latest'

images:
  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/oatmeal-farm-registry/otf:latest'
